services:
  - type: web
    name: honeycloud-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.threat_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false